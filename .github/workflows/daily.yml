name: Pipeline diário

on:
  workflow_dispatch:
  schedule:
    # 00:10 UTC = 21:10 em Fortaleza (UTC−3, sem horário de verão): logo depois do fechamento do candle diário
    # da Binance (00:00 UTC). O sinal só muda uma vez por dia, então não há ganho em rodar com mais frequência.
    - cron: "10 0 * * *"

permissions:
  contents: read

concurrency:
  group: crypto-analyzer-diario
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Escolher o host da API da Binance que responde a este runner
        run: |
          # api.binance.com recusa data centers de algumas regiões (HTTP 451). data-api.binance.vision serve os
          # mesmos dados públicos de mercado; usamos o primeiro que devolver candles (HTTP 200).
          for host in https://api.binance.com https://data-api.binance.vision; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 \
              "${host}/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=1" || true)
            echo "${host} respondeu HTTP ${status}"
            if [ "${status}" = "200" ]; then
              echo "BINANCE_API_HOST=${host}" >> "${GITHUB_ENV}"
              exit 0
            fi
          done
          echo "::error title=Binance inacessível a partir deste runner::Nem api.binance.com nem data-api.binance.vision devolveram HTTP 200 (451 = bloqueio regional; 000 = sem resposta). Sem preços novos o pipeline não deve rodar. Rode em um runner self-hosted em região sem bloqueio ou troque de fonte de preço."
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar o uv
        run: python -m pip install "uv==0.13.0"

      - name: Instalar as dependências (versões travadas)
        run: uv sync --locked

      - name: Rodar o pipeline e enviar o resumo ao Telegram
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run python -m src.pipeline --notify

      # Estado de auditoria desta execução: o runner é descartado no fim do job. Só dados públicos de mercado e
      # metadados (registro de fontes, revisões de candles, fingerprint dos dados usados, snapshot dos sinais);
      # nenhuma posição (não existem no runner) e nenhum segredo. Artefato privado do repositório, 90 dias.
      # Não é a fonte de verdade dos preços (a Binance é: tudo é rebaixado a cada execução); serve para auditar
      # falhas de coleta e revisões. Falhar aqui nunca derruba o job.
      - name: Guardar o estado de auditoria da execução
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: auditoria-${{ github.run_id }}
          path: |
            data/market/source_log/
            data/market/revisions/
            data/market/dataset_manifest/
            data/signals/history/
          if-no-files-found: warn
          retention-days: 90
