name: Pipeline diário

on:
  workflow_dispatch:
  schedule:
    # 21:07 UTC = 18:07 em Fortaleza (UTC−3, sem horário de verão). O GitHub atrasa agendamentos por horas
    # (com "10 0" o job começou ~04:20 UTC em 16–18/10; com "37 0", às 05:11 UTC em 19/10, 02:11 em
    # Fortaleza). Agendar às 21:07 UTC faz o resumo chegar à noite mesmo com o atraso.
    # Efeito no dado: antes de 00:00 UTC o último candle FECHADO é o do dia anterior (o candle aberto é
    # descartado pelo extrator e a checagem de desatualização aceita D−1); se o atraso passar da meia-noite
    # UTC, a execução já pega o candle do dia. Nos dois casos só entram candles fechados.
    # O sinal só muda uma vez por dia, então não há ganho em rodar com mais frequência.
    - cron: "7 21 * * *"

permissions:
  contents: read  # este repositório não recebe escrita do workflow; o estado vai ao repositório privado (deploy key)
  actions: write  # só para manter os agendamentos ativos (ver o último passo)

concurrency:
  group: crypto-analyzer-diario
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Conferir o segredo do repositório de estado
        env:
          STATE_DEPLOY_KEY: ${{ secrets.STATE_DEPLOY_KEY }}
        run: |
          # Sem a deploy key o estado (posições, sinais, avisos) não pode ser lido nem gravado. Falha cedo, sem imprimir o valor.
          if [ -z "${STATE_DEPLOY_KEY}" ]; then
            echo "::error title=Segredo STATE_DEPLOY_KEY ausente::Crie a deploy key do repositório cripto-analysis-state e grave a chave privada no secret STATE_DEPLOY_KEY deste repositório (ver docs/state.md)."
            exit 1
          fi

      - name: Escolher o host da API da Binance que responde a este runner
        run: |
          # api.binance.com recusa data centers de algumas regiões (HTTP 451). data-api.binance.vision serve os
          # mesmos dados públicos de mercado; usamos o primeiro que devolver candles (HTTP 200).
          for host in https://api.binance.com https://data-api.binance.vision; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 \
              "${host}/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=1" || true)
            echo "${host} respondeu HTTP ${status}"
            if [ "${status}" = "200" ]; then
              echo "BINANCE_API_HOST=${host}" >> "${GITHUB_ENV}"
              exit 0
            fi
          done
          echo "::error title=Binance inacessível a partir deste runner::Nem api.binance.com nem data-api.binance.vision devolveram HTTP 200 (451 = bloqueio regional; 000 = sem resposta). Sem preços novos o pipeline não deve rodar. Rode em um runner self-hosted em região sem bloqueio ou troque de fonte de preço."
          exit 1

      - uses: actions/checkout@v7

      # Estado persistente: suas posições, o registro imutável de sinais, o histórico de estados e os avisos já enviados.
      # Vive no repositório privado samuelmel/cripto-analysis-state (branch main, só dados), acessado por deploy key SSH.
      # O PC grava as posições nele com `python -m src.positions`.
      - name: Trazer o estado (repositório de estado)
        uses: actions/checkout@v7
        with:
          repository: samuelmel/cripto-analysis-state
          ref: main
          path: data/state
          ssh-key: ${{ secrets.STATE_DEPLOY_KEY }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar o uv
        run: python -m pip install "uv==0.13.0"

      - name: Instalar as dependências (versões travadas)
        run: uv sync --locked

      - name: Rodar o pipeline e enviar o resumo ao Telegram
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run python -m src.pipeline --notify --record-state

      # Grava o estado atualizado no repositório de estado (registro de sinais, histórico de estados, avisos enviados). Só roda
      # se o pipeline e o envio deram certo; se o push falhar, a mudança de estado é reavisada no dia seguinte (nunca se perde).
      # O checkout com ssh-key já deixa o remoto `origin` de data/state autenticado pela deploy key.
      - name: Gravar o estado (repositório de estado)
        if: success()
        working-directory: data/state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "estado sem mudanças"
          else
            git commit -q -m "estado: execução ${GITHUB_RUN_ID}"
            git push -q origin HEAD:main
          fi

      # Estado de auditoria desta execução: o runner é descartado no fim do job. Só dados públicos de mercado e
      # metadados (registro de fontes, revisões de candles, fingerprint dos dados usados, snapshot dos sinais);
      # nenhuma posição (não existem no runner) e nenhum segredo. Artefato do repositório (público quando o
      # repositório for público; só dados de mercado e metadados), 90 dias.
      # Não é a fonte de verdade dos preços (a Binance é: tudo é rebaixado a cada execução); serve para auditar
      # falhas de coleta e revisões. Falhar aqui nunca derruba o job.
      - name: Guardar o estado de auditoria da execução
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: auditoria-${{ github.run_id }}
          path: |
            data/market/source_log/
            data/market/revisions/
            data/market/dataset_manifest/
            data/signals/history/
          if-no-files-found: warn
          retention-days: 90

      # Repositório público sem atividade por 60 dias tem os workflows agendados desligados. Este passo reativa os agendamentos
      # a cada execução. Falhar aqui nunca derruba o job.
      - name: Manter os agendamentos ativos
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily.yml/enable"
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/base-pesquisa.yml/enable"
