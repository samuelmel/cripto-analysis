name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lock, tipos estritos e testes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar o uv (mesma versão do workflow diário)
        run: python -m pip install "uv==0.13.0"

      - name: O uv.lock está em dia com o pyproject.toml
        run: uv lock --check

      - name: Nenhum dado gerado, CSV ou segredo versionado
        run: |
          bad=$(git ls-files '*.parquet' '*.csv' '.env' '.env.*' | grep -Ev '^(tests/golden|evidence)/.*\.parquet$' || true)
          if [ -n "$bad" ]; then
            echo "::error title=Arquivo proibido versionado::$bad"
            exit 1
          fi

      - name: Instalar as dependências (versões travadas)
        run: uv sync --locked

      - name: Tipos estritos
        run: uv run mypy --strict src/ mcp_server.py run.py

      - name: Testes (nenhum acessa a rede)
        run: uv run pytest -q

  frontend:
    name: Frontend (tsc estrito, testes e build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar as dependências (pnpm-lock.yaml)
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Tipos estritos
        run: pnpm run typecheck
        working-directory: frontend

      - name: Testes unitários
        run: pnpm test
        working-directory: frontend

      - name: Build (tsc --noEmit estrito + vite build)
        run: pnpm run build
        working-directory: frontend
