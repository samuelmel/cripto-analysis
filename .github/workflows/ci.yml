name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lock, tipos estritos e testes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar o uv (mesma versão do workflow diário)
        run: python -m pip install "uv==0.13.0"

      - name: O uv.lock está em dia com o pyproject.toml
        run: uv lock --check

      - name: Instalar as dependências (versões travadas)
        run: uv sync --locked

      - name: Tipos estritos
        run: uv run mypy --strict src/ mcp_server.py

      - name: Testes (nenhum acessa a rede)
        run: uv run pytest -q

  frontend:
    name: Frontend (tsc estrito e build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Instalar as dependências (package-lock.json)
        run: npm --prefix frontend ci

      - name: Build (tsc --noEmit estrito + vite build)
        run: npm --prefix frontend run build
