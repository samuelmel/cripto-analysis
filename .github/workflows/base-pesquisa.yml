name: Base de pesquisa

# Atualiza a base de pesquisa (arquivo oficial da Binance: pares em USDT e os pares em BTC que ampliam o histórico) e a
# guarda na branch `base-pesquisa`, só de dados, com um único commit substituído a cada execução (não acumula tamanho).
# Incremental: restaura a base anterior e baixa só os arquivos novos ou revisados (ETag + SHA-256). Se qualquer par
# falhar, o job fica vermelho e a base anterior continua intacta (nada é publicado).
# Restaurar em qualquer máquina: git fetch origin base-pesquisa && git archive origin/base-pesquisa | tar -x -C data/

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 2 * *"   # dia 2 de cada mês, 03:17 UTC: o arquivo mensal da Binance do mês anterior já existe

permissions:
  contents: write  # só para gravar a branch `base-pesquisa`; o workflow nunca escreve na `main`

concurrency:
  group: base-pesquisa
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Restaurar a base anterior (branch base-pesquisa)
        run: |
          mkdir -p data
          if git fetch --depth=1 origin base-pesquisa; then
            git archive FETCH_HEAD | tar -x -C data/
            echo "base anterior restaurada: $(find data -type f | wc -l) arquivos"
          else
            echo "branch base-pesquisa ainda não existe: download completo"
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar o uv
        run: python -m pip install "uv==0.13.0"

      - name: Instalar as dependências (versões travadas)
        run: uv sync --locked

      - name: Atualizar os pares em USDT
        run: uv run python -m src.archive sync --all --pairs 6

      - name: Atualizar os pares em BTC que ampliam o histórico
        run: uv run python research/build_btc_pairs.py

      - name: Publicar na branch base-pesquisa (um único commit)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_INDEX_FILE="${RUNNER_TEMP}/base-index"
          git read-tree --empty
          git --work-tree=data add -f archive archive_btc
          tree=$(git write-tree)
          unset GIT_INDEX_FILE
          commit=$(git commit-tree "$tree" -m "base de pesquisa: arquivo oficial da Binance (USDT e pares em BTC), $(date -u +%Y-%m-%d), execução ${GITHUB_RUN_ID}")
          git push --force origin "${commit}:refs/heads/base-pesquisa"
          echo "publicado: $(git ls-tree -r --name-only "$commit" | wc -l) arquivos"
