[project]
name = "crypto-analyzer"
version = "0.1.0"
description = "Extração e análise de OHLCV histórico de criptomoedas em Parquet particionado"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.5",
    "ccxt>=4.3",
    "mcp>=2.3.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
]
